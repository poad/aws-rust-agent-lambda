version: 2
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: daily
      timezone: Asia/Tokyo
      interval: "weekly"
    assignees:
      - poad

updates:
  - package-ecosystem: github-actions
    directory: /
    allow:
      - dependency-type: all
    cooldown:
      default-days: 7
    rebase-strategy: auto
    multi-ecosystem-group: "all-dependencies"
    patterns:
      - '*'

  - package-ecosystem: npm
    directories:
      - '/'
    multi-ecosystem-group: "all-dependencies"
    patterns:
      - '*'
    allow:
      - dependency-type: all
    cooldown:
      default-days: 7
    rebase-strategy: auto


  - package-ecosystem: cargo
    directories:
      - '/lambda/'
    multi-ecosystem-group: "all-dependencies"
    patterns:
      - '*'
    allow:
      - dependency-type: all
    cooldown:
      default-days: 7
    rebase-strategy: auto
